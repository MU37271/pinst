<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>存储诊断</title>
<style>
body{font-family:-apple-system,"PingFang SC",sans-serif;margin:0;padding:20px;background:#f2f2f4;color:#141416;
  padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 14px}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.7;
  border:.5px solid rgba(0,0,0,.08)}
.k{color:#8b8b92;font-size:12px;display:block}
.ok{color:#0a7}  .bad{color:#c33}
button{width:100%;height:46px;border:0;border-radius:12px;background:#141416;color:#fff;font-size:15px;margin-bottom:10px}
code{background:#eee;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<h1>存储诊断</h1>

<div class="card">
  <span class="k">运行环境</span>
  <div id="env">读取中…</div>
</div>

<div class="card">
  <span class="k">localStorage（模型配置/提示词）</span>
  <div id="ls">读取中…</div>
</div>

<div class="card">
  <span class="k">IndexedDB（相册图片）</span>
  <div id="idb">读取中…</div>
</div>

<div class="card">
  <span class="k">说明</span>
  <div style="font-size:13px;color:#555">如果这里显示"为空"但 App 里明明有数据，说明是浏览器清空了存储。
  点下面的按钮写入一条测试记录，然后<strong>完全退出 App</strong>（上滑关闭），从主屏图标重新打开，再看这里是否还在。</div>
</div>

<button onclick="writeTest()">① 写入测试数据</button>
<button onclick="readAll()">② 重新读取</button>

<script>
function set(id, html, cls){ const el=document.getElementById(id); el.innerHTML=html; }

function envInfo(){
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  set('env', [
    'iOS: ' + (ios ? '是' : '否'),
    '主屏 App 模式: ' + (standalone ? '是' : '否（在 Safari 里）'),
    '存储配额: ' + (navigator.storage && navigator.storage.estimate ? '可查询' : '不可查'),
  ].join('<br>'));
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(e=>{
      const used = (e.usage/1024/1024).toFixed(2);
      const quota = (e.quota/1024/1024).toFixed(0);
      set('env', [
        'iOS: ' + (ios ? '是' : '否'),
        '主屏 App 模式: ' + (standalone ? '是' : '否（在 Safari 里）'),
        '已用: ' + used + ' MB / 配额: ' + quota + ' MB',
      ].join('<br>'));
    });
  }
}

function readLS(){
  try{
    const raw = localStorage.getItem('prompt_workbench_v3');
    const test = localStorage.getItem('__diag_test');
    if(!raw){
      set('ls', '<span class="bad">✗ 没有数据</span>' + (test ? '<br>测试记录: ' + test : ''), '');
      return;
    }
    const d = JSON.parse(raw);
    set('ls', [
      '<span class="ok">✓ 有数据</span>',
      '模型配置: ' + (d.modelConfigs||[]).length + ' 个 ' + (d.modelConfigs||[]).map(c=>'（'+c.name+'）').join(''),
      '提示词: ' + (d.prompts||[]).length + ' 条',
      '相册: ' + (d.gallery||[]).length + ' 组',
      test ? '测试记录: ' + test : '',
      '数据大小: ' + (raw.length/1024).toFixed(1) + ' KB',
    ].filter(Boolean).join('<br>'));
  }catch(e){ set('ls', '<span class="bad">读取失败: ' + e.message + '</span>'); }
}

function readIDB(){
  const req = indexedDB.open('prompt_workbench_db', 1);
  req.onupgradeneeded = e => { if(!e.target.result.objectStoreNames.contains('imgs')) e.target.result.createObjectStore('imgs'); };
  req.onsuccess = e => {
    const db = e.target.result;
    if(!db.objectStoreNames.contains('imgs')){ set('idb', '✗ 没有 imgs 表'); db.close(); return; }
    const tx = db.transaction('imgs','readonly');
    const r = tx.objectStore('imgs').count();
    r.onsuccess = () => { set('idb', r.result > 0 ? '<span class="ok">✓ ' + r.result + ' 张图片</span>' : '<span class="bad">✗ 0 张图片</span>'); db.close(); };
    r.onerror = () => { set('idb', '✗ 读取失败'); db.close(); };
  };
  req.onerror = () => set('idb', '<span class="bad">✗ 无法打开数据库</span>');
}

function writeTest(){
  localStorage.setItem('__diag_test', new Date().toLocaleString());
  // 同时写一张图片测 IndexedDB
  const c = document.createElement('canvas'); c.width = 8; c.height = 8;
  c.getContext('2d').fillRect(0,0,8,8);
  const url = c.toDataURL('image/png');
  const req = indexedDB.open('prompt_workbench_db', 1);
  req.onupgradeneeded = e => { if(!e.target.result.objectStoreNames.contains('imgs')) e.target.result.createObjectStore('imgs'); };
  req.onsuccess = e => {
    const db = e.target.result;
    const tx = db.transaction('imgs','readwrite');
    tx.objectStore('imgs').put(url, '__diag_img');
    tx.oncomplete = () => { db.close(); alert('已写入。请完全退出 App（上滑关闭），再从主屏图标打开，点「重新读取」看是否还在。'); readAll(); };
  };
}

function readAll(){ readLS(); readIDB(); }

envInfo(); readAll();
</script>
</body>
</html>
