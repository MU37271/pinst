<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 黑白灰液态玻璃质感：径向高光 + 斜向渐变 -->
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9e9ee"/>
      <stop offset="1" stop-color="#cfcfd6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- 底：黑白灰渐变方块（iOS 圆角由系统裁切，故画满） -->
  <rect width="512" height="512" fill="url(#sheet)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 玻璃卡片群：三张叠放，暗示"收藏" -->
  <g filter="url(#shadow)">
    <rect x="150" y="150" width="212" height="212" rx="52" fill="url(#bar)"/>
    <rect x="150" y="150" width="212" height="212" rx="52" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <!-- 卡内三条"提示词"行 -->
    <rect x="196" y="204" width="120" height="14" rx="7" fill="#ffffff" opacity=".92"/>
    <rect x="196" y="242" width="150" height="10" rx="5" fill="#ffffff" opacity=".45"/>
    <rect x="196" y="266" width="96" height="10" rx="5" fill="#ffffff" opacity=".3"/>
    <!-- 底部一颗高光 -->
    <circle cx="316" cy="312" r="15" fill="#ffffff" opacity=".9"/>
    <path d="M316 304l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z" fill="#16161a"/>
  </g>

  <!-- 前景小玻璃条：呼应底部 Tab 栏 -->
  <g filter="url(#shadow)">
    <rect x="140" y="382" width="232" height="56" rx="28" fill="url(#bar)"/>
    <rect x="140" y="382" width="232" height="56" rx="28" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <rect x="168" y="404" width="48" height="12" rx="6" fill="#ffffff" opacity=".95"/>
    <circle cx="256" cy="410" r="6" fill="#ffffff" opacity=".32"/>
    <circle cx="344" cy="410" r="6" fill="#ffffff" opacity=".32"/>
  </g>
</svg>
